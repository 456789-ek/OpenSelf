<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Openself：做过的项目会各写一篇介绍。项目即将加入。" />
  <meta name="theme-color" content="#161310" />
  <title>项目 · Openself</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/system.css" />
  <link rel="stylesheet" href="css/home.css" />
  <script>
    (function () {
      var root = document.documentElement;
      root.classList.add("js");
      window.addEventListener("pagereveal", function (event) {
        if (!event.viewTransition) return;
        root.classList.add("vt-arrive");
        root.classList.remove("is-arriving");
      });
      try {
        var turn = sessionStorage.getItem("openself-turn");
        if (!turn) return;
        sessionStorage.removeItem("openself-turn");
        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        root.classList.add("is-arriving");
      } catch (err) {}
    })();
  </script>
</head>
<body class="page-projects">
  <a class="skip" href="#main">跳到主要内容</a>
  <div class="progress" data-progress aria-hidden="true"></div>

  <header class="site-header is-solid" data-header>
    <a class="brand" href="index.html">
      <span class="seal" aria-hidden="true">开</span>
      <span class="brand-name">Openself</span>
    </a>
    <nav class="site-nav" aria-label="页内">
      <a href="notes.html">笔记</a>
      <a href="projects.html" aria-current="page">项目</a>
    </nav>
  </header>

  <main id="main">
    <section class="band projects" id="projects" aria-labelledby="projects-title">
      <div class="wrap reveal">
        <div class="section-head">
          <p class="index-no">01</p>
          <div>
            <h2 id="projects-title">项目</h2>
            <p>做完的项目，各写一篇介绍。现在没有可以打开的成品。</p>
          </div>
        </div>

        <div class="frames">
          <button class="frame" type="button" data-open="project" data-tilt>
            <span class="frame-kicker">空位 01</span>
            <span class="frame-title">项目即将加入</span>
            <span class="frame-go">打开</span>
          </button>
          <button class="frame" type="button" data-open="project" data-tilt>
            <span class="frame-kicker">空位 02</span>
            <span class="frame-title">项目即将加入</span>
            <span class="frame-go">打开</span>
          </button>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <span class="seal" aria-hidden="true">开</span>
    <p>Openself · 学习笔记与项目介绍</p>
  </footer>

  <dialog class="entry" id="entry">
    <div class="entry-shell">
      <button class="icon-btn" type="button" data-close>关闭</button>

      <article class="entry-panel" data-panel="project" hidden>
        <p class="kicker">项目</p>
        <h2 id="entry-projects-title">项目即将加入</h2>
        <p>做过的项目会各写一篇介绍。这里还是空的，没有可以打开的成品。</p>
        <div class="slots" role="list">
          <div class="slot" role="listitem">空位 01</div>
          <div class="slot" role="listitem">空位 02</div>
        </div>
      </article>
    </div>
  </dialog>

  <script src="js/home.js"></script>
</body>
</html>
