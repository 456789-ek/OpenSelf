<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Openself：个人学习笔记与项目介绍。" />
  <meta name="theme-color" content="#07091a" />
  <title>Openself</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/system.css" />
  <link rel="stylesheet" href="css/home.css?v=night" />
  <link rel="stylesheet" href="js/openself-particle.css?v=night" />
  <style>
    .page-home {
      background: #07091a;
    }
    .page-home .night-sky {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }
    .page-home .word,
    .page-home .choices {
      position: relative;
      z-index: 1;
    }
    .page-home .word {
      width: 100%;
      height: clamp(400px, 62vh, 680px);
    }
    .page-home .word-particles {
      position: absolute;
      inset: 0;
    }
    .word.is-ready .word-fallback {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      margin: -1px !important;
      overflow: hidden !important;
      clip: rect(0, 0, 0, 0) !important;
    }
  </style>
  <script>
    (function () {
      var root = document.documentElement;
      root.classList.add("js");
      window.addEventListener("pagereveal", function (event) {
        if (!event.viewTransition) return;
        root.classList.add("vt-arrive");
        root.classList.remove("is-arriving");
      });
      try {
        var turn = sessionStorage.getItem("openself-turn");
        if (!turn) return;
        sessionStorage.removeItem("openself-turn");
        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        root.classList.add("is-arriving");
      } catch (err) {}
    })();
  </script>
</head>
<body class="page-home">
  <a class="skip" href="#main">跳到主要内容</a>

  <main id="main" class="hero">
    <canvas id="night-sky" class="night-sky" aria-hidden="true"></canvas>
    <h1 id="hero-title" class="word">
      <span class="word-fallback">openself</span>
      <div id="openself-title" class="word-particles"></div>
    </h1>
    <nav class="choices" aria-label="进入">
      <a href="notes.html">笔记</a>
      <a href="projects.html">项目</a>
    </nav>
  </main>

  <script src="js/sky.js?v=night"></script>
  <script src="js/openself-particle.js?v=night"></script>
  <script src="js/home.js"></script>
</body>
</html>
