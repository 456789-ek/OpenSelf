<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Openself：个人学习笔记与项目介绍。" />
  <meta name="theme-color" content="#161310" />
  <title>Openself</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/system.css" />
  <link rel="stylesheet" href="css/home.css" />
  <script>
    (function () {
      var root = document.documentElement;
      root.classList.add("js");
      window.addEventListener("pagereveal", function (event) {
        if (!event.viewTransition) return;
        root.classList.add("vt-arrive");
        root.classList.remove("is-arriving");
      });
      try {
        var turn = sessionStorage.getItem("openself-turn");
        if (!turn) return;
        sessionStorage.removeItem("openself-turn");
        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        root.classList.add("is-arriving");
      } catch (err) {}
    })();
  </script>
</head>
<body class="page-home">
  <a class="skip" href="#main">跳到主要内容</a>

  <main id="main" class="hero">
    <div class="hero-glow" aria-hidden="true"></div>
    <h1 id="hero-title" class="word" aria-label="openself">
      <span class="word-letters" aria-hidden="true"><span class="word-letter" style="--i: 0">o</span><span class="word-letter" style="--i: 1">p</span><span class="word-letter" style="--i: 2">e</span><span class="word-letter" style="--i: 3">n</span><span class="word-letter" style="--i: 4">s</span><span class="word-letter" style="--i: 5">e</span><span class="word-letter" style="--i: 6">l</span><span class="word-letter" style="--i: 7">f</span></span>
    </h1>
    <nav class="choices" aria-label="进入">
      <a href="notes.html">笔记</a>
      <a href="projects.html">项目</a>
    </nav>
  </main>

  <script src="js/home.js"></script>
</body>
</html>
