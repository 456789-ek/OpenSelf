  <link rel="prefetch" href="index.html" />
  <script>
    (function () {
      var root = document.documentElement;
      root.classList.add("js");
      window.addEventListener("pagereveal", function (event) {
        if (!event.viewTransition) return;
        root.classList.add("vt-arrive");
        root.classList.remove("is-arriving");
      });
      var reduce = false;
      try {
        reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      } catch (err) {}
      try {
        var cameraRaw = sessionStorage.getItem("openself-camera");
        if (cameraRaw) {
          sessionStorage.removeItem("openself-camera");
          if (!reduce) {
            var camera = JSON.parse(cameraRaw);
            if (camera && camera.mode === "return") {
              root.classList.add("camera-return");
              root.setAttribute("data-camera-target", camera.target || "");
            } else if (camera && camera.mode === "arrive") {
              root.classList.add("is-camera-arrive");
            }
          }
        }
        var turn = sessionStorage.getItem("openself-turn");
        if (!turn) return;
        sessionStorage.removeItem("openself-turn");
        if (reduce || root.classList.contains("is-camera-arrive") || root.classList.contains("camera-return")) return;
        root.classList.add("is-arriving");
      } catch (err) {}
    })();
  </script>
</head>
