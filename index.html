<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Openself：个人学习笔记与项目介绍。按语言进入 C、C++、Python，项目介绍随后补上。" />
  <meta name="theme-color" content="#161310" />
  <title>Openself</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/system.css" />
  <link rel="stylesheet" href="css/home.css" />
  <script>
    (function () {
      var root = document.documentElement;
      root.classList.add("js");
      window.addEventListener("pagereveal", function (event) {
        if (!event.viewTransition) return;
        root.classList.add("vt-arrive");
        root.classList.remove("is-arriving");
      });
      try {
        var turn = sessionStorage.getItem("openself-turn");
        if (!turn) return;
        sessionStorage.removeItem("openself-turn");
        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        root.classList.add("is-arriving");
      } catch (err) {}
    })();
  </script>
</head>
<body>
  <a class="skip" href="#main">跳到主要内容</a>
  <div class="progress" data-progress aria-hidden="true"></div>

  <header class="site-header" data-header>
    <a class="brand" href="#top">
      <span class="seal" aria-hidden="true">开</span>
      <span class="brand-name">Openself</span>
    </a>
    <nav class="site-nav" aria-label="页内">
      <a href="notes.html">笔记</a>

    </nav>
  </header>

  <main id="main">
    <section class="hero" id="top" aria-labelledby="hero-title">

      <p class="hero-bg" aria-hidden="true">Openself</p>

      <div class="hero-inner wrap">
        <div class="hero-copy">

          <h1 id="hero-title" class="hero-title">
            <span class="line">学过的，</span>
            <span class="line">放在这里。</span>
          </h1>
          <p class="lede">
            C、C++、Python 的学习笔记，以及做过的项目介绍。文章还没写进来，入口先铺好。
          </p>
          <div class="hero-actions">
            <a class="btn btn-solid" href="notes.html">进入笔记</a>
            <a class="btn btn-ghost" href="projects.html">看项目</a>
          </div>
        </div>

        <div class="fan" data-fan>
          <a class="card" href="notes.html#c" style="--rot: -13deg; --x: -64px; --shade: #f6f0e4" aria-label="C，笔记即将加入">
            <span class="card-top"><span>01</span><span>笔记</span></span>
            <span class="card-lang">C</span>

          </a>
          <a class="card" href="notes.html#cpp" style="--rot: -3deg; --x: -8px; --shade: #f3ead9" aria-label="C++，笔记即将加入">

          </a>
          <a class="card" href="notes.html#python" style="--rot: 8deg; --x: 46px; --shade: #efe3d2" aria-label="Python，笔记即将加入">
            <span class="card-top"><span>03</span><span>笔记</span></span>
            <span class="card-lang">Py</span>
            <span class="card-state">笔记即将加入</span>
          </a>
          <a class="card card-ghost" href="notes.html#more" style="--rot: 16deg; --x: 96px" aria-label="下一门语言，以后再加">
            <span class="card-top"><span>04</span><span>以后</span></span>
            <span class="card-lang">+</span>

        </div>

      <div class="marquee" aria-hidden="true">

          <p>C · C++ · Python · 笔记即将加入 · 项目即将加入 · 下一门语言 ·&nbsp;</p>

    </section>

  <footer class="site-footer">
    <span class="seal" aria-hidden="true">开</span>
    <p>Openself · 学习笔记与项目介绍</p>
  </footer>

  <script src="js/home.js"></script>

</html>
